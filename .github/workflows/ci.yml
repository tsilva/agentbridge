name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Audit dependencies
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pip-audit

      - name: Lint
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} ruff check agentbridge tests

      - name: Run tests
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pytest -q

      - name: Smoke test CLI
        run: uv run --frozen --python ${{ matrix.python-version }} agentbridge --help

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build
