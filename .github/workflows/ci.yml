name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Audit dependencies
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pip-audit

      - name: Lint
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} ruff check agentbridge tests

      - name: Validate Svelte dashboard
        run: |
          npm install --global pnpm@10.33.0 --ignore-scripts --min-release-age=10080
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build
          if [[ -n "$(git status --porcelain -- agentbridge/static/dashboard)" ]]; then
            echo "Rebuild and commit dashboard assets with frontend changes" >&2
            exit 1
          fi

      - name: Run tests
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pytest -q

      - name: Smoke test CLI
        run: uv run --frozen --python ${{ matrix.python-version }} agentbridge --help

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build
