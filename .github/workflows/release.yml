name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current pyproject version if it is not already tagged
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.publish.outputs.should-publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "pyproject.toml"; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}
      - name: Audit dependencies
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pip-audit
      - name: Lint
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} ruff check agentbridge tests
      - name: Run tests
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pytest -q

  pii-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test menu-bar app
        run: swift test --package-path macos

  build:
    needs: [changes, test, pii-scan, macos-test]
    if: needs.changes.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check-version.outputs.tag_exists == 'false' }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        id: check-version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              pyproject = tomllib.load(pyproject_file)

          print(pyproject["project"]["version"])
          PY
          )"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_exists=true
          else
            tag_exists=false
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "Version ${version} maps to ${tag}; tag_exists=${tag_exists}"
      - name: Setup uv
        if: steps.check-version.outputs.tag_exists == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build package
        if: steps.check-version.outputs.tag_exists == 'false'
        run: uv build
      - name: Verify PyPI project metadata
        if: steps.check-version.outputs.tag_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          import email.parser
          import glob
          import tarfile
          import tomllib
          import zipfile

          expected_name = "agentbridge-cli"
          names = set()

          for wheel in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(wheel) as archive:
                  metadata_path = next(
                      name
                      for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  )
                  metadata = archive.read(metadata_path).decode()
                  names.add(email.parser.Parser().parsestr(metadata)["Name"])

          for sdist in glob.glob("dist/*.tar.gz"):
              with tarfile.open(sdist, "r:gz") as archive:
                  pyproject_path = next(
                      member
                      for member in archive.getmembers()
                      if member.name.endswith("/pyproject.toml")
                  )
                  pyproject_file = archive.extractfile(pyproject_path)
                  if pyproject_file is None:
                      raise RuntimeError(f"Could not read {pyproject_path.name}")
                  pyproject = tomllib.loads(pyproject_file.read().decode())
                  names.add(pyproject["project"]["name"])

          if names != {expected_name}:
              raise RuntimeError(
                  f"Expected built project name {expected_name!r}, got {sorted(names)!r}"
              )

          print(f"Verified PyPI project name: {expected_name}")
          PY
      - name: Store package artifacts
        if: steps.check-version.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  macos-app:
    needs: [build]
    if: >-
      needs.build.outputs.publish == 'true' &&
      vars.MACOS_RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/agentbridge-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -1)"
          test -n "$identity"
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build signed application
        run: scripts/build_macos_app.sh
      - name: Verify embedded application
        run: scripts/verify_macos_app.sh "build/macos/${{ matrix.architecture }}/AgentBridge.app"
      - name: Notarize and staple disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          dmg="$(find "build/macos/${{ matrix.architecture }}" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Store macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            build/macos/${{ matrix.architecture }}/*.dmg
            build/macos/${{ matrix.architecture }}/*.dmg.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, publish, macos-app]
    if: >-
      always() &&
      needs.build.outputs.publish == 'true' &&
      needs.publish.result == 'success' &&
      (needs.macos-app.result == 'success' || needs.macos-app.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Download macOS artifacts
        if: needs.macos-app.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-app-*-${{ github.sha }}
          path: dist/
          merge-multiple: true
      - name: Create GitHub release
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/*
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}

  publish:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agentbridge-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*
