name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current pyproject version if it is not already tagged
        required: false
        default: false
        type: boolean
      attach_macos:
        description: Build and attach macOS DMGs to the current version's existing release
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.publish.outputs.should-publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Release dispatches require main" >&2
            exit 1
          fi
          if [[ "${{ inputs.publish }}" == "true" && "${{ inputs.attach_macos }}" == "true" ]]; then
            echo "Choose publication or macOS recovery, not both" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "pyproject.toml"; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Check frozen lock metadata
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}
      - name: Audit dependencies
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pip-audit
      - name: Lint
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} ruff check agentbridge tests .codex/skills/build-release/scripts/release_build.py
      - name: Validate Svelte dashboard
        run: |
          npm install --global pnpm@10.33.0 --ignore-scripts --min-release-age=10080
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build
          if [[ -n "$(git status --porcelain -- agentbridge/static/dashboard)" ]]; then
            echo "Rebuild and commit dashboard assets with frontend changes" >&2
            exit 1
          fi

      - name: Run tests
        run: uv run --frozen --extra test --python ${{ matrix.python-version }} pytest -q

  pii-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test menu-bar app
        run: swift test --package-path macos

  build:
    needs: [changes, test, pii-scan, macos-test]
    if: needs.changes.outputs.should-publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ needs.changes.outputs.should-publish == 'true' && steps.check-version.outputs.tag_exists == 'false' }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        id: check-version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              pyproject = tomllib.load(pyproject_file)

          print(pyproject["project"]["version"])
          PY
          )"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_exists=true
          else
            tag_exists=false
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "Version ${version} maps to ${tag}; tag_exists=${tag_exists}"
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Validate release metadata
        run: python .codex/skills/build-release/scripts/release_build.py ci-metadata
      - name: Require an unused publication version
        if: needs.changes.outputs.should-publish == 'true' && steps.check-version.outputs.tag_exists == 'false'
        run: python .codex/skills/build-release/scripts/release_build.py ci-metadata --require-unused
      - name: Build package
        run: uv build
      - name: Audit distributions and installed wheel
        run: python .codex/skills/build-release/scripts/release_build.py audit-dist
      - name: Store package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  macos-app:
    needs: [build]
    if: >-
      needs.build.result == 'success' &&
      (needs.build.outputs.publish == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Build ad-hoc-signed application
        run: scripts/build_macos_app.sh
      - name: Verify embedded application
        run: scripts/verify_macos_app.sh "build/macos/${{ matrix.architecture }}/AgentBridge.app"
      - name: Verify disk image checksum
        working-directory: build/macos/${{ matrix.architecture }}
        run: shasum -a 256 -c ./*.dmg.sha256
      - name: Store macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            build/macos/${{ matrix.architecture }}/*.dmg
            build/macos/${{ matrix.architecture }}/*.dmg.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, publish, macos-app]
    if: >-
      always() &&
      needs.build.outputs.publish == 'true' &&
      needs.publish.result == 'success' &&
      needs.macos-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-app-*-${{ github.sha }}
          path: dist/
          merge-multiple: true
      - name: Create GitHub release
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --generate-notes dist/*
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}

  attach-macos:
    needs: [macos-app]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attach_macos == true &&
      needs.macos-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-app-*-${{ github.sha }}
          path: dist/
          merge-multiple: true
      - name: Attach DMGs to the existing release
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              print(tomllib.load(pyproject_file)["project"]["version"])
          PY
          )"
          tag="v${version}"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" dist/* --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build, macos-app]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agentbridge-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*
