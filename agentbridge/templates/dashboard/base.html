<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}agentbridge{% endblock %}</title>
    {% block head_scripts %}{% endblock %}
    <style>
        :root {
            --bg: #f7f8f8;
            --surface: #ffffff;
            --surface-muted: #f1f3f3;
            --text: #1f2424;
            --muted: #667070;
            --border: #dfe4e4;
            --accent: #168575;
            --accent-strong: #0f6f62;
            --danger: #b42318;
            --danger-border: #f5c6c1;
            --warn: #a15c07;
            --ok: #1b806a;
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
            --header-height: 64px;
            --topbar-bg: rgba(255, 255, 255, 0.92);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        button, input, select, textarea {
            font: inherit;
        }

        .app {
            height: 100vh;
            display: grid;
        }

        .topbar {
            min-height: var(--header-height);
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 21px;
            font-weight: 750;
            letter-spacing: 0;
            text-decoration: none;
        }

        .brand-mark {
            flex: none;
            width: 28px;
            height: 21px;
        }

        .main-nav {
            justify-self: start;
            height: 42px;
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            overflow: hidden;
            box-shadow: 0 1px 0 rgba(18, 27, 27, 0.03);
        }

        .nav-item {
            appearance: none;
            min-width: 112px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            color: var(--muted);
            background: transparent;
            text-decoration: none;
            border: 0;
            border-bottom: 3px solid transparent;
            font-weight: 550;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-strong);
            border-bottom-color: var(--accent);
            background: #fbfefe;
        }

        .nav-item:focus-visible {
            outline: 2px solid rgba(22, 133, 117, 0.35);
            outline-offset: -2px;
        }

        .nav-item:hover {
            color: var(--text);
            background: var(--surface-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        {% block page_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="/dashboard">
                <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24" fill="none" stroke="#f04438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="2" y1="16" x2="30" y2="16"></line>
                    <path d="M4 16 Q16 4 28 16"></path>
                    <line x1="10" y1="16" x2="10" y2="11.2" stroke-opacity="0.5" stroke-width="1.5"></line>
                    <line x1="16" y1="16" x2="16" y2="7" stroke-opacity="0.5" stroke-width="1.5"></line>
                    <line x1="22" y1="16" x2="22" y2="11.2" stroke-opacity="0.5" stroke-width="1.5"></line>
                </svg>
                AgentBridge
            </a>
            <nav class="main-nav" aria-label="Dashboard views">
                <a class="nav-item{% if active_view == 'monitor' %} active{% endif %}" href="/dashboard">Monitor</a>
                <a class="nav-item{% if active_view == 'chat' %} active{% endif %}" href="/dashboard/chat">Chat</a>
            </nav>
            <div class="header-actions">
                {% block header_actions %}{% endblock %}
            </div>
        </header>
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
