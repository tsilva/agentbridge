<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00483D">
    <link rel="icon" href="/dashboard/brand/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/dashboard/brand/apple-touch-icon.png">
    <link rel="manifest" href="/dashboard/brand/site.webmanifest">
    <title>{% block title %}agentbridge{% endblock %}</title>
    {% block head_scripts %}{% endblock %}
    <style>
        :root {
            --bg: #f4f1e8;
            --surface: #fffefa;
            --surface-muted: #ebe8de;
            --text: #16211f;
            --muted: #61716d;
            --border: #d8d6cc;
            --accent: #006b5b;
            --accent-strong: #00483d;
            --signal: #ff7a73;
            --danger: #b42318;
            --danger-border: #f5c6c1;
            --warn: #a15c07;
            --ok: #1b806a;
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
            --header-height: 64px;
            --topbar-bg: rgba(244, 241, 232, 0.94);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        button, input, select, textarea {
            font: inherit;
        }

        .app {
            height: 100vh;
            display: grid;
        }

        .topbar {
            min-height: var(--header-height);
            background: var(--topbar-bg);
            border-bottom: 2px solid var(--signal);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 21px;
            font-weight: 750;
            letter-spacing: 0;
            text-decoration: none;
        }

        .brand-mark {
            flex: none;
            width: 28px;
            height: 28px;
        }

        .main-nav {
            justify-self: start;
            height: 42px;
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            overflow: hidden;
            box-shadow: 0 1px 0 rgba(18, 27, 27, 0.03);
        }

        .nav-item {
            appearance: none;
            min-width: 112px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            color: var(--muted);
            background: transparent;
            text-decoration: none;
            border: 0;
            border-bottom: 3px solid transparent;
            font-weight: 550;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-strong);
            border-bottom-color: var(--signal);
            background: var(--surface);
        }

        .nav-item:focus-visible {
            outline: 2px solid rgba(255, 122, 115, 0.45);
            outline-offset: -2px;
        }

        .nav-item:hover {
            color: var(--text);
            background: var(--surface-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        {% block page_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="/dashboard">
                <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#00483d"></rect>
                    <circle cx="16" cy="15" r="10" fill="#f4f1e8"></circle>
                    <path d="M17.5 10.5H11m0 0 2.5-2.5M11 10.5l2.5 2.5M14.5 19.5H21m0 0L18.5 17M21 19.5 18.5 22" fill="none" stroke="#16211f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M7 27h18" fill="none" stroke="#ff7a73" stroke-width="2" stroke-linecap="round"></path>
                </svg>
                AgentBridge
            </a>
            <nav class="main-nav" aria-label="Dashboard views">
                <a class="nav-item{% if active_view == 'monitor' %} active{% endif %}" href="/dashboard">Monitor</a>
                <a class="nav-item{% if active_view == 'chat' %} active{% endif %}" href="/dashboard/chat">Chat</a>
            </nav>
            <div class="header-actions">
                {% block header_actions %}{% endblock %}
            </div>
        </header>
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
