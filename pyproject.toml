[project]
name = "agentbridge-cli"
version = "0.1.12"
description = "Bridge OpenAI tools to Claude Code SDK, Codex CLI, and OpenRouter"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "tsilva"}]
requires-python = ">=3.12"
keywords = ["claude", "codex", "openai", "api", "bridge", "llm", "anthropic", "claude-code", "fastapi", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "claude-agent-sdk>=0.2.132",
    "openrouter==1.1.31",
    "jinja2>=3.1.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
test = [
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/tsilva/agentbridge"
Repository = "https://github.com/tsilva/agentbridge"
Issues = "https://github.com/tsilva/agentbridge/issues"

[project.scripts]
agentbridge = "agentbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentbridge"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/build",
    "/macos/.build",
    "/design-qa-implementation.png",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
required-version = "==0.11.13"
exclude-newer = "7 days"
constraint-dependencies = [
  "click>=8.3.3",
  "cryptography>=50.0.0",
  "idna>=3.15",
  "mcp>=1.28.1",
  "pydantic-settings>=2.14.2",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.31",
  "starlette>=1.3.1",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
